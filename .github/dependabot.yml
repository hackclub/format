version: 2
updates:
  # Frontend Bun dependencies
  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "daily"
    groups:
      lexical:
        patterns:
          - "@lexical/*"
          - "lexical"
      next-ecosystem:
        patterns:
          - "next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      types:
        patterns:
          - "@types/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      typescript:
        patterns:
          - "typescript"
          - "@typescript/*"

  # Backend Go modules
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "daily"
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      golang-x:
        patterns:
          - "golang.org/x/*"
      google:
        patterns:
          - "google.golang.org/*"
          - "github.com/googleapis/*"
          - "cloud.google.com/*"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
